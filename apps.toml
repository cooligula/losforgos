# Newer platform APIs than the SDK the port compiles against. The voicemail IPv4 wait checks the
# link addresses instead of asking the platform whether 8.8.8.8 is reachable, and the "promoted
# ongoing" request (Android 16) is made by reflection.
[[apps.dialer.replace]]
