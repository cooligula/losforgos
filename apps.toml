from = "http://schemas.android.com/apk/res/com.android.inputmethod.latin"
to = "http://schemas.android.com/apk/res-auto"

# Native build: a current NDK (16 KB pages by default), arm64 only, and no -Werror so that
# newer compiler warnings do not break the build. jcenter() is gone.
[[apps.keyboard.replace]]
file = "build.gradle"
from = "ndkVersion '25.1.8937393'"
to = "ndkVersion '27.3.13750724'"

[[apps.keyboard.replace]]
file = "build.gradle"
from = 'testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"'
to = """testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a' }"""

[[apps.keyboard.replace]]
file = "build.gradle"
from = "jcenter()"
to = "mavenCentral()"

[[apps.keyboard.replace]]
file = "native/jni/AndroidNdk.mk"
from = "LOCAL_CFLAGS += -Werror -Wall"
to = "LOCAL_CFLAGS += -Wall"

[[apps.keyboard.replace]]
file = "native/jni/AndroidNdk.mk"
from = "LOCAL_LDFLAGS += -ldl"
to = "LOCAL_LDFLAGS += -ldl -Wl,-z,max-page-size=16384"

# ---------------------------------------------------------------------------
# Phase 3: ports of apps that upstream only builds with Soong.
