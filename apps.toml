  /**
   * Whether the DTMF tone length can be chosen. Both the telephony and the carrier configuration
   * lookups throw for an app without the matching privileges, which then simply means "hide it".
   */
  private boolean shouldShowDtmfToneLength() {
    try {
      TelephonyManager telephonyManager =
          (TelephonyManager) requireActivity().getSystemService(Context.TELEPHONY_SERVICE);
      return telephonyManager != null
          && telephonyManager.canChangeDtmfToneLength()
          && (telephonyManager.isWorldPhone() || !shouldHideCarrierSettings());
    } catch (Throwable t) {
