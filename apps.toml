# Settings > Sounds and vibration without "Modify system settings". Upstream registers no click
# listener on that entry (its onPreferenceClick is never called), so the sound fragment always
# opened and crashed in onCreatePreferences while reading values the platform withholds. The tap is
# now intercepted: a toast and the screen where the user grants the permission. The fragment
# itself no longer trusts what it looks up.
[[apps.dialer.replace]]
file = "java/com/android/dialer/app/settings/DialerSettingsActivity.java"
from = "      soundSettings.setViewId(R.id.settings_header_sounds_and_vibration);"
to = '''      soundSettings.setViewId(R.id.settings_header_sounds_and_vibration);
      soundSettings.setOnPreferenceClickListener(this);'''

[[apps.dialer.replace]]
file = "java/com/android/dialer/app/settings/DialerSettingsActivity.java"
from = '''    public boolean onPreferenceClick(@NonNull Preference preference) {
      if (preference.getTitle().equals(getString(R.string.sounds_and_vibration_title))) {
        // If we don't have the permission to write to system settings, go to system sound
        // settings instead. Otherwise, perform the super implementation (which launches our
        // own preference fragment.
        if (!Settings.System.canWrite(getContext())) {
          Toast.makeText(getContext(),
                          getResources().getString(R.string.toast_cannot_write_system_settings),
                          Toast.LENGTH_SHORT)
                  .show();
          startActivity(new Intent(Settings.ACTION_SOUND_SETTINGS));
          return true;
        }
      }
      super.onPreferenceTreeClick(preference);
      return false;
    }
'''
to = '''    public boolean onPreferenceClick(@NonNull Preference preference) {
      // Without the permission to write system settings the sound settings can only be read, so
      // send the user to where it is granted. Returning false lets the preference open its
      // fragment as usual.
      if (SoundSettingsFragment.class.getName().equals(preference.getFragment())
          && !Settings.System.canWrite(requireContext())) {
        requestWriteSettingsPermission();
        return true;
      }
      return false;
    }

    private void requestWriteSettingsPermission() {
      Context context = requireContext();
      try {
        Toast.makeText(
                context,
                context.getString(R.string.toast_cannot_write_system_settings),
                Toast.LENGTH_SHORT)
            .show();
      } catch (Throwable t) {
        LogUtil.w("DialerSettingsActivity.requestWriteSettingsPermission", "no toast: %s", t);
      }
      Intent[] attempts = {
        new Intent(
            Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + context.getPackageName())),
        new Intent(Settings.ACTION_SOUND_SETTINGS)
      };
      for (Intent intent : attempts) {
        try {
          startActivity(intent);
          return;
        } catch (android.content.ActivityNotFoundException | SecurityException e) {
          LogUtil.w(
              "DialerSettingsActivity.requestWriteSettingsPermission",
              "cannot open %s: %s",
              intent.getAction(),
              e);
        }
      }
    }
'''

