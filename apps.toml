# 3. Hardening, for the "no incoming calls" report: if the foreground service cannot take the
#    microphone type (RECORD_AUDIO not granted, or the process is in the background), keep the
#    call notification as a plain phone-call foreground service instead of throwing in onCallAdded.
[[apps.dialer.replace]]
file = "java/com/android/incallui/call/TelecomAdapter.java"
from = '''    inCallService.startForeground(id, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_PHONE_CALL
        | ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);'''
to = '''    try {
      inCallService.startForeground(id, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_PHONE_CALL
          | ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
    } catch (SecurityException | IllegalStateException e) {
      LogUtil.w("TelecomAdapter.startForegroundNotification",
          "microphone type refused, retrying as phone call only: %s", e);
      inCallService.startForeground(id, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_PHONE_CALL);
    }'''

# 4. Resources live under the application id (org.losforgos.dialer), not the Gradle namespace
#    (com.android.dialer) that the R class uses, so the helpline string lookup by name never matched.
#    Ask the resources for their own package name instead of hardcoding one.
