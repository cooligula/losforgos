# One entry per LineageOS app. `sha` is the pinned upstream commit; the bump workflow moves it.
# Only user-space apps are listed. Platform-signed / privileged apps are out of scope.

[defaults]
upstream = "https://github.com/LineageOS"
branch = "lineage-24.0"
java = 17
variants = ["unmodified"]

# ---------------------------------------------------------------------------
# Phase 1: Gradle projects that build standalone.
# ---------------------------------------------------------------------------

[apps.glimpse]
title = "Glimpse"
description = "Gallery"
repo = "android_packages_apps_Glimpse"
sha = "8caac09fe1fe0cadb2fa828ac5755c8fb9481eb5"
application_id = "org.losforgos.glimpse"
# "modified" also shows every photo of a Pixel Camera lock screen session, not only the last one.
# Both variants share the application id, so Obtainium follows only the modified one.
variants = ["modified", "unmodified"]
obtainium_variant = "modified"
enabled = true

[apps.aperture]
title = "Aperture"
description = "Camera"
repo = "android_packages_apps_Aperture"
sha = "36b3be3487b5154b1950ed2120225acdca6c51de"
application_id = "org.losforgos.aperture"
enabled = true
native = true   # zxing-cpp; needs a memory tagging test on a Pixel 8 or newer

[apps.jelly]
title = "Jelly"
description = "Browser"
repo = "android_packages_apps_Jelly"
sha = "8ba5afd7b9d4319f263dfeb9ce744924ad137812"
application_id = "org.losforgos.jelly"
enabled = true

[apps.recorder]
title = "Recorder"
description = "Audio recorder"
repo = "android_packages_apps_Recorder"
sha = "624957ca18496e7b63df3d5e4e040f8c99ca72b7"
application_id = "org.losforgos.recorder"
enabled = true
# shortcuts.xml cannot use ${applicationId}, so it is rewritten to the new id.
[[apps.recorder.replace]]
file = "app/src/main/res/xml/shortcuts.xml"
from = 'android:targetPackage="org.lineageos.recorder"'
to = 'android:targetPackage="org.losforgos.recorder"'

[apps.twelve]
title = "Twelve"
description = "Music player"
repo = "android_packages_apps_Twelve"
sha = "de4ff1b687f9bb53a229d60e61bfd563f3bad383"
application_id = "org.losforgos.twelve"
enabled = true

[apps.camelot]
title = "Camelot"
description = "PDF viewer"
repo = "android_packages_apps_Camelot"
sha = "ef9cfc2fcced48ff46f6be580f3f653b05bae08e"
application_id = "org.losforgos.camelot"
enabled = true

[apps.etar]
title = "Etar"
description = "Calendar"
repo = "android_packages_apps_Etar"
sha = "8173ec802ed046d1670ec03962e686e393a85335"
application_id = "org.losforgos.etar"
# Lint vital crashes on JDK 17 (NoSuchMethodError List.removeLast), it needs JDK 21.
java = 21
enabled = true
# AGP 9 rejects package= in the manifest (namespace is already in build.gradle.kts).
[[apps.etar.replace]]
file = "app/src/main/AndroidManifest.xml"
from = 'package="org.lineageos.etar"'
to = ""
# shortcuts.xml cannot use ${applicationId}, so it is rewritten to the new id.
[[apps.etar.replace]]
file = "app/src/main/res/xml-v25/shortcuts.xml"
from = 'android:targetPackage="org.lineageos.etar"'
to = 'android:targetPackage="org.losforgos.etar"'

# ---------------------------------------------------------------------------
# Bridge between Pixel Camera (Gcam) and a third-party gallery such as Glimpse.
# Upstream: Gcam Services Provider, "photosonly" flavor (the one GrapheneOS needs).
# The "modified" variant forwards secure reviews (lock screen) to the gallery; the
# "probe" variant also logs the camera's intent, to capture what Pixel Camera sends.
# Probe builds are pre-releases and are not tracked by Obtainium.
# ---------------------------------------------------------------------------

[apps.gcam-bridge]
title = "Gcam Bridge"
description = "Opens the gallery from Pixel Camera, including secure review on the lock screen"
upstream = "https://github.com/lukaspieper"
repo = "Gcam-Services-Provider"
branch = "main"
sha = "5c7557b1cd0ee861b211f4f17e7088e724008389"
# Pixel Camera looks for this exact package, so it must not be renamed.
application_id = "com.google.android.apps.photos"
rename_application_id = false
gradle_task = ":app:assemblePhotosonlyRelease"
apk_dir = "app/build/outputs/apk/photosonly/release"
variants = ["modified", "probe"]
enabled = true

# ---------------------------------------------------------------------------
# Phase 2: Gradle projects with the app at the repository root (no :app module).
# ---------------------------------------------------------------------------

[apps.calculator]
title = "Calculator"
description = "Calculator"
repo = "android_packages_apps_ExactCalculator"
sha = "933974f9fd722e5c79ee0343a251ad5444ac8a23"
application_id = "org.losforgos.calculator"
build_file = "build.gradle.kts"
gradle_task = ":assembleRelease"
apk_dir = "build/outputs/apk/release"
enabled = true

[apps.deskclock]
title = "Clock"
description = "Alarm clock, timer and stopwatch"
repo = "android_packages_apps_DeskClock"
sha = "85cde5712f2f3eb6a0ffa9d6951ec4a83734586e"
application_id = "org.losforgos.deskclock"
build_file = "build.gradle"
gradle_task = ":assembleRelease"
apk_dir = "build/outputs/apk/release"
base_version = "1.0"   # upstream declares no versionName
enabled = true

# The manifest declares this app as the replacement for the old AOSP clock packages.
[[apps.deskclock.replace]]
file = "AndroidManifest.xml"
from = '<original-package android:name="com.android.alarmclock" />'
to = ""

[[apps.deskclock.replace]]
file = "AndroidManifest.xml"
from = '<original-package android:name="com.android.deskclock" />'
to = ""

# The default shared preferences file is named after the application id.
[[apps.deskclock.replace]]
file = "res/xml/data_extraction_rules.xml"
from = "com.android.deskclock_preferences.xml"
to = "org.losforgos.deskclock_preferences.xml"

[apps.keyboard]
title = "Keyboard"
description = "Keyboard (AOSP LatinIME)"
repo = "android_packages_inputmethods_LatinIME"
sha = "e417ba6faa5dbb66ba70a038a52ddc8f60bb5795"
application_id = "org.losforgos.keyboard"
build_file = "build.gradle"
gradle_task = ":assembleRelease"
apk_dir = "build/outputs/apk/release"
base_version = "1.0"
native = true   # libjni_latinime; needs a memory tagging test on a Pixel 8 or newer
enabled = true

# Names that would clash with the AOSP keyboard when both are installed (GrapheneOS ships it):
# the signature permission and the dictionary provider authority and actions.
[[apps.keyboard.replace]]
file = "java/src/com/android/inputmethod/latin/LatinIME.java"
from = '"com.android.inputmethod.latin.HIDE_SOFT_INPUT"'
to = '"org.losforgos.keyboard.HIDE_SOFT_INPUT"'

[[apps.keyboard.replace]]
file = "java/AndroidManifest.xml"
from = 'com.android.inputmethod.latin.HIDE_SOFT_INPUT'
to = 'org.losforgos.keyboard.HIDE_SOFT_INPUT'

[[apps.keyboard.replace]]
file = "java/src/com/android/inputmethod/dictionarypack/DictionaryPackConstants.java"
from = '"com.android.inputmethod.dictionarypack.aosp"'
to = '"org.losforgos.keyboard.dictionarypack"'

[[apps.keyboard.replace]]
file = "java/res/values/dictionary-pack.xml"
from = ">com.android.inputmethod.dictionarypack.aosp<"
to = ">org.losforgos.keyboard.dictionarypack<"

[[apps.keyboard.replace]]
