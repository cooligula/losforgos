# One entry per LineageOS app. `sha` is the pinned upstream commit; the bump workflow moves it.
# Only user-space apps are listed. Platform-signed / privileged apps are out of scope.

[defaults]
upstream = "https://github.com/LineageOS"
branch = "lineage-24.0"
java = 17
variants = ["unmodified"]

# ---------------------------------------------------------------------------
# Phase 1: Gradle projects that build standalone.
# ---------------------------------------------------------------------------

[apps.glimpse]
title = "Glimpse"
description = "Gallery"
repo = "android_packages_apps_Glimpse"
sha = "8caac09fe1fe0cadb2fa828ac5755c8fb9481eb5"
application_id = "org.losforgos.glimpse"
enabled = true

[apps.aperture]
title = "Aperture"
description = "Camera"
repo = "android_packages_apps_Aperture"
sha = "36b3be3487b5154b1950ed2120225acdca6c51de"
application_id = "org.losforgos.aperture"
enabled = true
native = true   # zxing-cpp; needs a memory tagging test on a Pixel 8 or newer

[apps.jelly]
title = "Jelly"
description = "Browser"
repo = "android_packages_apps_Jelly"
sha = "8ba5afd7b9d4319f263dfeb9ce744924ad137812"
application_id = "org.losforgos.jelly"
enabled = true

[apps.recorder]
title = "Recorder"
description = "Audio recorder"
repo = "android_packages_apps_Recorder"
sha = "624957ca18496e7b63df3d5e4e040f8c99ca72b7"
application_id = "org.losforgos.recorder"
enabled = true
# shortcuts.xml cannot use ${applicationId}, so it is rewritten to the new id.
[[apps.recorder.replace]]
file = "app/src/main/res/xml/shortcuts.xml"
from = 'android:targetPackage="org.lineageos.recorder"'
to = 'android:targetPackage="org.losforgos.recorder"'

[apps.twelve]
title = "Twelve"
description = "Music player"
repo = "android_packages_apps_Twelve"
sha = "de4ff1b687f9bb53a229d60e61bfd563f3bad383"
application_id = "org.losforgos.twelve"
enabled = true

[apps.camelot]
title = "Camelot"
description = "PDF viewer"
repo = "android_packages_apps_Camelot"
sha = "ef9cfc2fcced48ff46f6be580f3f653b05bae08e"
application_id = "org.losforgos.camelot"
enabled = true

[apps.etar]
title = "Etar"
description = "Calendar"
repo = "android_packages_apps_Etar"
sha = "8173ec802ed046d1670ec03962e686e393a85335"
application_id = "org.losforgos.etar"
enabled = true

# ---------------------------------------------------------------------------
# Later phases: listed so the plan is visible, but not built yet.
# ---------------------------------------------------------------------------
# calculator (ExactCalculator), deskclock, keyboard (LatinIME): Gradle, need rename + checks.
# messaging, contacts, dialer: Android.bp only, need a Gradle port (see docs/plan).
