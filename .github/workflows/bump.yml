name: bump upstream

on:
  schedule:
    - cron: "0 6 1,15 * *"   # twice a month, close enough to every two weeks
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: bump
        run: python3 scripts/losforgos.py bump | tee bump.txt

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="bump/upstream-$(date -u +%Y%m%d)"
          git config user.name "losforgos-bot"
          git config user.email "losforgos-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps.toml
          git commit -m "Bump upstream pins" -m "$(cat bump.txt)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump upstream pins ($(date -u +%Y-%m-%d))" \
            --body "$(printf 'Upstream moved:\n\n%s\n\nMerging this builds, signs and releases the changed apps.' "$(cat bump.txt)")"
          # PRs opened with GITHUB_TOKEN do not trigger workflows, so start the build on the branch.
          gh workflow run build.yml --ref "$branch"
